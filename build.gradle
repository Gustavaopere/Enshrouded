plugins {
    id 'java-library'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.1.26'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_file_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven {
        name = 'New JourneyMap Maven'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com/'
        content {
            includeGroup 'curse.maven'
        }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main.resources {
        srcDir('src/generated/resources')
    }
    gameTest {
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath + sourceSets.main.runtimeClasspath
    }
    arsZeroGameTest {
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath + sourceSets.main.runtimeClasspath
        resources.srcDir('src/gameTest/resources')
    }
}

runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('runs').dir(name)
        modSource project.sourceSets.main
    }
    client {}
    server {
        arguments.add '--nogui'
    }
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        modSource project.sourceSets.gameTest
    }
    arsZeroGameTestServer {
        type = 'gameTestServer'
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        modSource project.sourceSets.arsZeroGameTest
    }
    data {
        arguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
    }
}

// NeoGradle creates runServer as a JavaExec task but does not forward stdin.
// The dedicated-server reload harness needs console commands (save-all / stop),
// so opt this one run task into the Gradle process stdin explicitly.
tasks.withType(JavaExec).configureEach {
    if (name == 'runServer') {
        standardInput = System.in
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    arsZeroCompatRuntime {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly group: 'info.journeymap', name: 'journeymap-api-neoforge', version: '2.0.0-1.21.1'
    testImplementation group: 'info.journeymap', name: 'journeymap-api-neoforge', version: '2.0.0-1.21.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // Exact current-pack NeoForge 1.21.1 distribution for the Stage 09.01 real co-load gate.
    // These JARs are resolved only for the dedicated compatibility run and are never bundled.
    arsZeroCompatRuntime 'curse.maven:ars-zero-1377482:8703997'
    arsZeroCompatRuntime 'curse.maven:ars-nouveau-401955:8721482'
    arsZeroCompatRuntime 'curse.maven:ars-elemental-561470:8399862'
    arsZeroCompatRuntime 'curse.maven:curios-309927:6529130'
    arsZeroCompatRuntime 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.2'
    arsZeroCompatRuntime 'curse.maven:terrablender-neoforge-940057:6054947'
}

tasks.register('prepareArsZeroCompatMods', Sync) {
    from configurations.arsZeroCompatRuntime
    into project.layout.projectDirectory.dir('runs/arsZeroGameTestServer/mods')
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
