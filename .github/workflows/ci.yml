name: Enshrouded CI

on:
  push:
    branches:
      - main
      - round-1-foundation
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: enshrouded-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verify committed Gradle wrapper provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object gradlew)" = '0f14772e0e50ffe504fa3be1a869e6281b09ccd1'
          test "$(git hash-object gradlew.bat)" = '8de1053a1f921b9ac5910187e2f99fdaa774f81a'
          test "$(git hash-object gradle/wrapper/gradle-wrapper.jar)" = '1b33c55baabb587c669f562ae36f953de2481846'
          test -x gradlew

      - name: Verify Gradle wrapper
        run: ./gradlew --no-daemon --version

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Diff sanity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            git diff --check HEAD^ HEAD
          else
            BASE="$(git merge-base origin/main HEAD)"
            git diff --check "$BASE" HEAD
          fi

      - name: NeoForge build
        run: ./gradlew --no-daemon build

      - name: Verify built JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'Enshrouded*.jar' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -Fx 'META-INF/neoforge.mods.toml'
          jar tf "$JAR" | grep -Fx 'com/gustavaopere/enshrouded/Enshrouded.class'
          if jar tf "$JAR" | grep -Fq 'com/gustavaopere/enshrouded/gametest/'; then
            echo 'GameTest-only classes leaked into the production JAR'
            exit 1
          fi

      - name: GameTest server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/gameTestServer build
          printf 'eula=true\n' > runs/gameTestServer/eula.txt
          LOG="$PWD/build/gametest.log"
          set +e
          ./gradlew --no-daemon runGameTestServer 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -Fq 'No test functions were given!' "$LOG"; then
            echo 'GameTest discovery failed: zero test functions were registered'
            exit 1
          fi
          exit "$STATUS"

      - name: Dedicated-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/server build
          printf 'eula=true\n' > runs/server/eula.txt
          LOG="$PWD/build/server-smoke.log"
          ./gradlew --no-daemon runServer >"$LOG" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 150); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$LOG"; then
              grep -Fq 'Enshrouded bootstrap complete' "$LOG" || {
                cat "$LOG"
                exit 1
              }
              echo 'Dedicated-server smoke test: PASS'
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$LOG"
              exit 1
            fi
            sleep 1
          done
          cat "$LOG"
          exit 1
