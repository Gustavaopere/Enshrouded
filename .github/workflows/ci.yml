name: Enshrouded CI

on:
  push:
    branches:
      - main
      - round-1-foundation
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: enshrouded-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
          cache-read-only: false

      - name: Generate Gradle wrapper bootstrap artifact
        if: github.ref == 'refs/heads/round-1-foundation'
        run: gradle --no-daemon wrapper --gradle-version 8.14 --distribution-type bin

      - name: Export Gradle wrapper JAR bootstrap payload
        if: github.ref == 'refs/heads/round-1-foundation'
        shell: bash
        run: |
          set -euo pipefail
          echo 'GRADLE_WRAPPER_JAR_BASE64_BEGIN'
          base64 -w0 gradle/wrapper/gradle-wrapper.jar
          echo
          echo 'GRADLE_WRAPPER_JAR_BASE64_END'

      - name: Unit tests
        run: gradle --no-daemon test

      - name: Diff sanity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            git diff --check HEAD^ HEAD
          else
            BASE="$(git merge-base origin/main HEAD)"
            git diff --check "$BASE" HEAD
          fi

      - name: NeoForge build
        run: gradle --no-daemon build

      - name: Verify built JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'Enshrouded*.jar' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -Fx 'META-INF/neoforge.mods.toml'
          jar tf "$JAR" | grep -Fx 'com/gustavaopere/enshrouded/Enshrouded.class'

      - name: GameTest server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/gameTestServer
          printf 'eula=true\n' > runs/gameTestServer/eula.txt
          gradle --no-daemon runGameTestServer

      - name: Dedicated-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/server build
          printf 'eula=true\n' > runs/server/eula.txt
          LOG="$PWD/build/server-smoke.log"
          gradle --no-daemon runServer >"$LOG" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 150); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$LOG"; then
              grep -Fq 'Enshrouded bootstrap complete' "$LOG" || {
                cat "$LOG"
                exit 1
              }
              echo 'Dedicated-server smoke test: PASS'
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$LOG"
              exit 1
            fi
            sleep 1
          done
          cat "$LOG"
          exit 1
