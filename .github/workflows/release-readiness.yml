name: Level 1 Release Readiness

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'docs/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: enshrouded-release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Third-party provenance contract tests
        run: python3 -m unittest scripts/ci/test_third_party_provenance.py

      - name: Verify third-party provenance
        run: python3 scripts/verify_third_party_provenance.py

      - name: Level 1 release-readiness contract tests
        run: python3 -m unittest scripts/tests/test_verify_level1_release.py

      - name: Verify repository release readiness
        run: python3 scripts/verify_level1_release.py
